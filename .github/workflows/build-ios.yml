name: Build FitTrack iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout FitTrack
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript, lint, and tests
        run: |
          npm run typecheck
          npm run lint
          node --test scripts/*.test.cjs

      - name: Validate Expo capabilities
        run: node scripts/validate-ios-config.cjs

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Verify generated native capabilities
        shell: bash
        run: |
          set -euo pipefail
          entitlements_file="$(find ios -name '*.entitlements' -type f | head -n 1)"
          if [[ -z "$entitlements_file" ]]; then
            echo "No generated entitlements file was found."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$entitlements_file" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services:0' "$entitlements_file" | grep -q CloudDocuments
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers:0' "$entitlements_file" | grep -q 'iCloud.com.somekidfrombk.FitTrack'
          info_plist="$(find ios -mindepth 2 -maxdepth 2 -name 'Info.plist' -type f | head -n 1)"
          if [[ -z "$info_plist" ]]; then
            echo "No generated app Info.plist was found."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$info_plist" >/dev/null
          if /usr/libexec/PlistBuddy -c 'Print :NSHealthUpdateUsageDescription' "$info_plist" >/dev/null 2>&1; then
            echo "Unexpected HealthKit write-purpose permission was generated."
            exit 1
          fi

      - name: Show available schemes
        run: |
          echo "Available workspaces:"
          find ios -name "*.xcworkspace"

          echo "Available schemes:"
          xcodebuild -workspace ios/*.xcworkspace -list

      - name: Build unsigned iOS app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: FitTrack .app was not found."
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/FitTrack-unsigned.ipa" Payload

      - name: Upload FitTrack IPA
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-unsigned-iOS
          path: FitTrack-unsigned.ipa
          retention-days: 7
